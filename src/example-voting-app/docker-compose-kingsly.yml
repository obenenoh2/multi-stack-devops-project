services:
  vote:
    image: kingsly/vote:latest
    ports:
      - "5000:80"
    depends_on:
      - redis
    networks:
      - front-tier
      - back-tier
    environment:
      - REDIS_HOST=redis

  result:
    image: kingsly/result:latest
    ports:
      - "5001:80"
    depends_on:
      - db
    networks:
      - front-tier
      - back-tier
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  worker:
    image: dockersamples/examplevotingapp_worker:latest
    networks:
      - back-tier
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:alpine
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    networks:
      - back-tier
    volumes:
      - db-data:/var/lib/postgresql/data

networks:
  front-tier:
  back-tier:

volumes:
  db-data:
