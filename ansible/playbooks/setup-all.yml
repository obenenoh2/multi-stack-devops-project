          ║                                                              ║
          ║  🌐 Access your application:                                 ║
          ║     Vote App:    http://44.200.212.23                        ║
          ║     Results:     http://44.200.212.23:8080                   ║
          ║                                                              ║
          ║  📍 Frontend EC2 (44.200.212.23)                             ║
          ║     ├── Vote App (Port 80)                                   ║
          ║     └── Results App (Port 8080)                              ║
          ║                                                              ║
          ║  📍 Backend EC2 (10.0.2.188)                                 ║
          ║     ├── Redis (Port 6379)                                    ║
          ║     └── Worker (Processing)                                  ║
          ║                                                              ║
          ║  📍 Database EC2 (10.0.2.83)                                 ║
