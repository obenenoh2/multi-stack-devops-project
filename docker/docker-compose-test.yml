version: '3.8'

services:
  vote:
    image: dockersamples/examplevotingapp_vote:latest
    ports:
      - "5000:80"
    networks:
      - front-tier
      - back-tier

  result:
    image: dockersamples/examplevotingapp_result:latest
    ports:
      - "5001:80"
    networks:
      - front-tier
      - back-tier

  worker:
    image: dockersamples/examplevotingapp_worker:latest
    networks:
      - back-tier

  redis:
    image: redis:alpine
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=votes
    networks:
      - back-tier
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  front-tier:
  back-tier:

volumes:
  postgres_data:
